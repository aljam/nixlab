name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flake check
        run: nix flake check --print-build-logs

  build-hosts:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep pull-request CI inexpensive; build the full fleet on main and
        # manual dispatch runs.
        host: ${{
          github.event_name == 'pull_request'
          && fromJSON('["navi"]')
          || fromJSON('["navi", "oryx", "r820", "r730", "r730xd"]')
        }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Build host
        id: build
        run: |
          path="$(nix build \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Push to aljam cache
        run: nix path-info --recursive "${{ steps.build.outputs.path }}" | cachix push aljam

  summary:
    needs: [check, build-hosts]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Host builds and cache upload completed"
