name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Flake check
        run: nix flake check --print-build-logs

  select-hosts:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hosts: ${{ steps.select.outputs.hosts }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select affected hosts
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          all_hosts = ["navi", "oryx", "r820", "r730", "r730xd"]

          if event != "pull_request":
              hosts = all_hosts
          else:
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base, head], text=True
              ).splitlines()

              host_paths = {
                  "navi": ["hosts/navi/"],
                  "oryx": ["hosts/oryx/"],
                  "r820": ["hosts/r820/"],
                  "r730": ["hosts/r730/"],
                  "r730xd": ["hosts/r730xd/"],
              }

              shared_paths = [
                  "flake.nix",
                  "flake.lock",
                  "modules/",
                  "users/",
                  "tests/",
                  ".github/workflows/ci.yml",
              ]

              hosts = []
              for host, prefixes in host_paths.items():
                  affected = any(
                      path.startswith(prefix)
                      for path in changed
                      for prefix in prefixes
                  )
                  if affected:
                      hosts.append(host)

              shared_changed = any(
                  path == shared_path or path.startswith(shared_path)
                  for path in changed
                  for shared_path in shared_paths
              )

              if shared_changed:
                  hosts = all_hosts

              hosts = sorted(set(hosts))

          print("Selected hosts:", ", ".join(hosts) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hosts={json.dumps(hosts)}\n")
          PY

  build-hosts:
    needs: select-hosts
    if: needs.select-hosts.outputs.hosts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        host: ${{ fromJSON(needs.select-hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Build host
        id: build
        run: |
          path="$(nix build \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Push to aljam cache
        if: github.event_name != 'pull_request'
        run: nix path-info --recursive "${{ steps.build.outputs.path }}" | cachix push aljam

  summary:
    needs: [check, select-hosts, build-hosts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report selected hosts
        run: |
          hosts='${{ needs.select-hosts.outputs.hosts }}'
          result='${{ needs.build-hosts.result }}'
          echo "Affected hosts: $hosts"
          echo "Host build result: $result"

          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi

          echo "✅ CI completed"
