groups:
  - name: host-health
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.host }} for five minutes."

      - alert: FilesystemAlmostFull
        expr: >-
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem is almost full"
          description: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} has less than 20% free space."

      - alert: FilesystemFull
        expr: >-
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem is critically full"
          description: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} has less than 10% free space."

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Systemd unit failed"
          description: "{{ $labels.instance }} has failed unit {{ $labels.name }}."

      - alert: HostMemoryPressure
        expr: >-
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory pressure"
          description: "{{ $labels.instance }} has less than 10% available memory."

  - name: runtime-drift
    rules:
      - alert: ListeningTCPSocketsIncreased
        expr: >-
          nixlab_listening_tcp_sockets
          > (nixlab_listening_tcp_sockets offset 1h)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Listening TCP socket count increased"
          description: >-
            {{ $labels.instance }} has more listening TCP sockets than one hour ago.
            Verify whether a new service was intentionally deployed.

      - alert: NftablesRulesetDrift
        expr: >-
          nixlab_nftables_ruleset_sha256
          unless nixlab_nftables_ruleset_sha256 offset 1h
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "nftables ruleset changed"
          description: >-
            {{ $labels.instance }} has a new nftables ruleset hash. Confirm the
            change came from a reviewed NixOS deployment.

      - alert: DeploymentRevisionUnknown
        expr: >-
          nixlab_system_revision{revision=~"^$|dirty.*"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Host is running an untracked configuration"
          description: >-
            {{ $labels.instance }} is running a dirty or unknown NixOS revision.
            Redeploy from a committed flake revision.

  - name: matrix
    rules:
      - alert: MatrixClientAPIUnreachable
        expr: probe_success{job="blackbox-matrix-client"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Matrix client API is unreachable"
          description: "The Matrix client versions endpoint did not return HTTP 200 for five minutes."

      - alert: MatrixFederationAPIUnreachable
        expr: probe_success{job="blackbox-matrix-federation"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Matrix federation API is unreachable"
          description: "The Matrix server-key endpoint did not return HTTP 200 for five minutes."

      - alert: MatrixRTCUnreachable
        expr: probe_success{job="blackbox-matrix-rtc"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Matrix RTC is unreachable"
          description: "The Matrix RTC frontend did not return HTTP 200 for five minutes."

  - name: postgresql
    rules:
      - alert: PostgreSQLUnreachable
        expr: probe_success{job="blackbox-postgres"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "The TCP probe cannot reach PostgreSQL on {{ $labels.instance }}."

      - alert: PostgreSQLTLSVerificationFailed
        expr: probe_success{job="blackbox-postgres-tls"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL TLS verification failed"
          description: "Prometheus cannot verify the PostgreSQL TLS certificate on {{ $labels.instance }}."

      - alert: PostgreSQLCertificateExpiringSoon
        expr: >-
          probe_ssl_earliest_cert_expiry{job="blackbox-postgres-tls"}
          - time()
          < 14 * 24 * 60 * 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL certificate expires soon"
          description: "The PostgreSQL TLS certificate on {{ $labels.instance }} expires in less than 14 days."

      - alert: PostgreSQLCertificateExpiringCritical
        expr: >-
          probe_ssl_earliest_cert_expiry{job="blackbox-postgres-tls"}
          - time()
          < 7 * 24 * 60 * 60
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL certificate expires imminently"
          description: "The PostgreSQL TLS certificate on {{ $labels.instance }} expires in less than 7 days."
