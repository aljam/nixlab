<div class="visualizer-wrap">
  <canvas id="visualizer-canvas"></canvas>
</div>

<script>
  (function () {
    const canvas = document.getElementById("visualizer-canvas");
    const audio = document.getElementById("radio-audio");

    let audioContext;
    let sourceNode;
    let analyser;
    let visualizer;
    let presetIndex = 0;

    const presets = [];

    async function start() {
      if (!window.butterchurn) {
        console.warn("Butterchurn not loaded");
        return;
      }

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      sourceNode = audioContext.createMediaElementSource(audio);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;

      // Route audio through the analyser so Butterchurn receives live data.
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      visualizer = butterchurn.createVisualizer(audioContext, canvas, {
        width: canvas.width,
        height: canvas.height,
        pixelRatio: window.devicePixelRatio || 1,
      });

      visualizer.connectAudio(analyser);

      const presetKeys = butterchurn.getPresets();
      const presetNames = Object.keys(presetKeys);

      presetNames.forEach((name) => {
        presets.push(presetKeys[name]);
      });

      visualizer.loadPreset(presets[presetIndex], 0.0);
      visualizer.setRendererSize(canvas.width, canvas.height);

      requestAnimationFrame(renderFrame);
    }

    function renderFrame() {
      visualizer.render();
      requestAnimationFrame(renderFrame);
    }

    function resize() {
      const pixelRatio = window.devicePixelRatio || 1;

      canvas.width = window.innerWidth * pixelRatio;
      canvas.height = window.innerHeight * pixelRatio;

      if (visualizer) {
        visualizer.setRendererSize(canvas.width, canvas.height);
      }
    }

    window.addEventListener("resize", resize);
    resize();

    audio.addEventListener("play", () => {
      if (!visualizer) {
        start();
      }
    });
  })();
</script>
