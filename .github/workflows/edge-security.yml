name: Edge security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  public-endpoints:
    name: Validate public HAProxy endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssl

      - name: Validate public endpoints
        env:
          ENDPOINTS_FILE: docs/public-endpoints.json
        run: |
          set -euo pipefail
          bash scripts/check-public-endpoints.sh "$ENDPOINTS_FILE"
