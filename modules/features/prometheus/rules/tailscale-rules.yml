groups:
  - name: nixlab-tailscale
    rules:
      - alert: TailscaleStatusDown
        expr: nixlab_tailscale_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale status is down"
          description: "Host {{ $labels.instance }} reports that Tailscale is down or its status cannot be exported."

      - alert: TailscaleDegraded
        expr: nixlab_tailscale_address_configured == 0 or nixlab_tailscale_peer_online == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tailscale connectivity is degraded"
          description: "Host {{ $labels.instance }} has no Tailscale address or no online peers."

      - alert: TailscaleServiceUnreachable
        expr: probe_success{network="tailscale"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale service is unreachable"
          description: "The service at {{ $labels.instance }} could not be reached through the pfSense Tailscale subnet route."

      - alert: TailscaleProbeMissing
        expr: absent(probe_success{network="tailscale"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No Tailscale reachability probes are reporting"
          description: "Prometheus is not receiving results from any Tailscale service probes."
