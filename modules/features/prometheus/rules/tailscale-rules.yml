groups:
  - name: nixlab-tailscale
    rules:
      - alert: TailscaleDaemonDown
        expr: nixlab_tailscale_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale daemon is unavailable"
          description: "Host {{ $labels.instance }} cannot export Tailscale status."

      - alert: TailscaleAddressMissing
        expr: nixlab_tailscale_address_configured == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale address is missing"
          description: "Host {{ $labels.instance }} does not have a Tailscale address."

      - alert: TailscaleNoOnlinePeers
        expr: nixlab_tailscale_peer_online == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No Tailscale peers are online"
          description: "Host {{ $labels.instance }} reports no online Tailscale peers."
