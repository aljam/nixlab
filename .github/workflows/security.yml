name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Scan tracked files and Git history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose

  sops-policy:
    name: Require explicit SOPS rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check SOPS creation rules
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          config = pathlib.Path(".sops.yaml").read_text()
          patterns = re.findall(r"^\s*path_regex:\s*(.+)$", config, re.MULTILINE)
          fallback = "secrets/.*\\.yaml$"
          missing = []

          for path in sorted(pathlib.Path("secrets").glob("*.yaml")):
              rel = path.as_posix()
              explicit = any(
                  pattern != fallback and re.fullmatch(pattern, rel)
                  for pattern in patterns
              )
              if not explicit:
                  missing.append(rel)

          if missing:
              raise SystemExit(
                  "Missing explicit SOPS creation rule for:\n"
                  + "\n".join(f"- {path}" for path in missing)
              )
          PY

  nix:
    name: Evaluate Nix checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check flake
        run: nix flake check --show-trace
