# .sops.yaml
keys:
  - &aljam ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHzrMiro1XD8krk5Kb4EWQ+rGjmgKXha/OuOmUZcopRL navi-desktop
  - &navi age1762y5d2qd2w7uhe5eytj3r3g6c5wa04wej85ulcwemhfz903xetq3ecu59
  - &oryx age1cmqwuvuflmhg30sz5j6h9cztavahx8ep3rkshmfuqswdt0h9u48qa3x298
  - &r730xd age1wydscnqxyykujdxnpq0ekf84535dtz4vzhfz5el0h4h3us9vpusqhhctar
  - &r730 age19ld0986nwpmydnq9smwc47grdqektew3pv8hk9rcasw32vss49xqmsayuw
  - &r820 age1m63qqf3u6n7dlsjdh6mke4wejntwuarm8y7jrjzp59zaua809gsskgddvk

creation_rules:
  # Fleet-wide user/login secret.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *aljam
          - *navi
          - *oryx
          - *r730
          - *r730xd
          - *r820

  # NAS credentials are needed only by the desktop hosts that mount the NAS.
  - path_regex: secrets/nas\.yaml$
    key_groups:
      - age:
          - *aljam
          - *navi
          - *oryx

  # PostgreSQL / pgAdmin. r820 runs PostgreSQL and needs its pgAdmin secret.
  - path_regex: secrets/database\.yaml$
    key_groups:
      - age:
          - *aljam
          - *r820

  # Matrix Synapse and Matrix RTC / LiveKit.
  - path_regex: secrets/matrix\.yaml$
    key_groups:
      - age:
          - *aljam
          - *r730xd
          - *r820

  # Vaultwarden.
  - path_regex: secrets/vaultwarden\.yaml$
    key_groups:
      - age:
          - *aljam
          - *r730xd
          - *r820

  # Grafana and alerting.
  - path_regex: secrets/monitoring\.yaml$
    key_groups:
      - age:
          - *aljam
          - *r730
          - *r730xd
          - *r820

  # Recyclarr / media automation API keys.
  - path_regex: secrets/media\.yaml$
    key_groups:
      - age:
          - *aljam
          - *r730xd
