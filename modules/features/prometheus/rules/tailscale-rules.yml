groups:
  - name: nixlab-tailscale
    rules:
      - alert: TailscaleDaemonDown
        expr: nixlab_tailscale_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale daemon is unavailable"
          description: "Host {{ $labels.instance }} cannot export Tailscale status."

      - alert: TailscaleAddressMissing
        expr: nixlab_tailscale_address_configured == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale address is missing"
          description: "Host {{ $labels.instance }} does not have a Tailscale address."

      - alert: TailscaleNoOnlinePeers
        expr: nixlab_tailscale_peer_online == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No Tailscale peers are online"
          description: "Host {{ $labels.instance }} reports no online Tailscale peers."

      - alert: TailscaleServiceUnreachable
        expr: probe_success{network="tailscale"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale service is unreachable"
          description: "The service at {{ $labels.instance }} could not be reached through the pfSense Tailscale subnet route."

      - alert: TailscaleProbeMissing
        expr: absent(probe_success{network="tailscale"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No Tailscale reachability probes are reporting"
          description: "Prometheus is not receiving results from any Tailscale service probes."
