name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: aljam
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Check formatting (nixfmt)
        run: |
          set -euo pipefail

          if ! nix fmt -- --ci; then
            nix fmt

            diff_output="$(git --no-pager diff --unified=3 -- . ':(exclude)flake.lock')"

            echo "::error::Nix files are not formatted. Run 'nix fmt' locally. Formatting diff:"
            printf '%s\n' "$diff_output"
            exit 1
          fi

      - name: Flake check
        run: nix flake check --no-build --print-build-logs

      - name: Evaluate host configurations
        run: |
          set -euo pipefail

          hosts="$(nix eval --json --apply 'hosts: builtins.attrNames hosts' '.#nixosConfigurations' | jq -r '.[]')"

          for host in $hosts; do
            echo "Evaluating $host"
            nix eval \
              --raw \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" \
              > /dev/null
          done

  select-hosts:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hosts: ${{ steps.select.outputs.hosts }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected hosts
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          all_hosts = ["navi", "oryx", "r820", "r730", "r730xd"]

          if event != "pull_request":
              hosts = all_hosts
          else:
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base, head], text=True
              ).splitlines()

              host_paths = {
                  "navi": ["hosts/navi/"],
                  "oryx": ["hosts/oryx/"],
                  "r820": ["hosts/r820/"],
                  "r730": ["hosts/r730/"],
                  "r730xd": ["hosts/r730xd/"],
              }

              shared_paths = [
                  "flake.nix",
                  "flake.lock",
                  "modules/",
                  "users/",
                  "tests/",
                  ".github/workflows/ci.yml",
              ]

              hosts = []
              for host, prefixes in host_paths.items():
                  affected = any(
                      path.startswith(prefix)
                      for path in changed
                      for prefix in prefixes
                  )
                  if affected:
                      hosts.append(host)

              shared_changed = any(
                  path == shared_path or path.startswith(shared_path)
                  for path in changed
                  for shared_path in shared_paths
              )

              if shared_changed:
                  hosts = all_hosts

              hosts = sorted(set(hosts))

          print("Selected hosts:", ", ".join(hosts) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hosts={json.dumps(hosts)}\n")
          PY

  build-hosts:
    needs: select-hosts
    if: >
      needs.select-hosts.outputs.hosts != '[]' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.select-hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: aljam
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Build host
        id: build
        run: |
          path="$(nix build \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Push to aljam cache
        if: github.event_name != 'pull_request'
        env:
          BUILD_PATH: ${{ steps.build.outputs.path }}
        run: |
          set -euo pipefail
          nix path-info --recursive "$BUILD_PATH" | cachix push aljam

  summary:
    needs: [check, select-hosts, build-hosts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report selected hosts
        env:
          HOSTS: ${{ needs.select-hosts.outputs.hosts }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build-hosts.result }}
        run: |
          set -euo pipefail
          echo "Affected hosts: $HOSTS"
          echo "Check result: $CHECK_RESULT"
          echo "Host build result: $BUILD_RESULT"

          if [[ "$CHECK_RESULT" != "success" && "$CHECK_RESULT" != "skipped" ]]; then
            echo "::error::CI check did not succeed: $CHECK_RESULT"
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ]]; then
            echo "::error::Host build did not succeed: $BUILD_RESULT"
            exit 1
          fi

          echo "✅ CI completed"
