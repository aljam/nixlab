name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Configure ALL caches before any builds
      - name: Configure Cachix caches
        run: |
          cachix use nix-community
          cachix use nix-gaming
          cachix use hyprland
          cachix use cuda-maintainers
          cachix use aljam

      - name: Flake check
        run: nix flake check --print-build-logs

  build-hosts:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [navi, oryx, r820, r730, r730xd]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Configure all caches for pulling
      - name: Configure Cachix caches
        run: |
          cachix use nix-community
          cachix use nix-gaming
          cachix use hyprland
          cachix use cuda-maintainers
          cachix use aljam

      - name: Build host
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Push to aljam cache only
        run: |
          result=$(nix build --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel)
          nix path-info --recursive $result | cachix push aljam

  summary:
    needs: [check, build-hosts]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All hosts built and cached"
