name: VM integration tests

# Nightly VM tests. firewall-isolation and admin-isolation are left out of
# `nix flake check` because they are slow (flake output `packages`), so this
# workflow is the only place that runs them. monitoring-health is a flake check
# and also runs on each pull request in security.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: vm-tests
  cancel-in-progress: false

jobs:
  vm-test:
    name: ${{ matrix.attr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attr:
          - checks.x86_64-linux.monitoring-health
          - packages.x86_64-linux.firewall-isolation
          - packages.x86_64-linux.admin-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland
          useDaemon: false

      - name: Run VM test
        env:
          ATTR: ${{ matrix.attr }}
        run: |
          nix build \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            ".#${ATTR}"
