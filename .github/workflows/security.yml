name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Scan tracked files and Git history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose

  ssh-key-hygiene:
    name: Require descriptive SSH key comments
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check SSH key comments
        run: python3 scripts/check-ssh-key-comments.py

  sops-policy:
    name: Require explicit SOPS rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check SOPS creation rules
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          config = pathlib.Path(".sops.yaml").read_text()
          patterns = re.findall(r"^\s*-\s*path_regex:\s*(.+)$", config, re.MULTILINE)
          broad_patterns = [
              "secrets/.*\\.yaml$",
              "secrets/.*",
              ".*",
          ]
          missing = []

          for path in sorted(pathlib.Path("secrets").glob("*.yaml")):
              rel = path.as_posix()
              explicit = any(
                  pattern not in broad_patterns and re.fullmatch(pattern, rel)
                  for pattern in patterns
              )
              if not explicit:
                  missing.append(rel)

          broad = [
              pattern
              for pattern in patterns
              if pattern in broad_patterns
          ]

          if broad:
              raise SystemExit(
                  "Broad SOPS fallback creation rules are forbidden:\n"
                  + "\n".join(f"- {pattern}" for pattern in broad)
              )

          if missing:
              raise SystemExit(
                  "Missing explicit SOPS creation rule for:\n"
                  + "\n".join(f"- {path}" for path in missing)
              )
          PY

  sops-recipients:
    name: Audit SOPS recipients
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check SOPS recipient policy
        run: python3 scripts/check-sops-recipients.py

  sops-recovery-drill:
    name: Validate SOPS recovery drill for ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - navi
          - oryx
          - r730
          - r730xd
          - r820

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check drill syntax
        run: bash -n scripts/sops-recovery-drill.sh

      - name: Run non-decrypting recovery drill
        run: bash scripts/sops-recovery-drill.sh --host "${{ matrix.host }}"

  nix:
    name: Evaluate Nix checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Check flake
        run: nix flake check --show-trace
