<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="derezzed.info — personal projects and infrastructure.">
  <meta name="robots" content="noindex, nofollow">
  <title>derezzed.info</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0b0f14;
      --fg: #e6edf3;
      --muted: #8b98a5;
      --accent: #58a6ff;
      --card: #121820;
      --border: #22303c;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --card: #ffffff;
        --border: #d0d7de;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding: 2rem;
    }

    main {
      width: min(42rem, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>derezzed.info</h1>
    <p>Personal projects and infrastructure.</p>
  </main>
</body>
</html>
