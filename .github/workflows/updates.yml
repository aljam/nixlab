name: Updates

on:
  schedule:
    # Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake lock
        run: nix flake update

      - name: Create update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/flake-update"
          git checkout -b "$branch"

          if git diff --quiet; then
            echo "No flake.lock changes; skipping pull request."
            exit 0
          fi

          git add flake.lock
          git commit -m "chore: update flake lock"
          git push --force origin "$branch"

          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update flake lock" \
              --body "Automated weekly nix flake update. Review the changed inputs, run nix flake check, and build the affected hosts before merging."
          fi
