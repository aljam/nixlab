groups:
  - name: tailscale-health
    rules:
      - alert: TailscaleDown
        expr: nixlab_tailscale_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale is down on {{ $labels.instance }}"
          description: >-
            The Tailscale health exporter could not collect status on
            {{ $labels.instance }}.

      - alert: TailscaleAddressMissing
        expr: nixlab_tailscale_address_configured == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale address missing on {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} does not report a configured Tailscale
            address.

      - alert: TailscaleNoOnlinePeers
        expr: nixlab_tailscale_peer_online == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No online Tailscale peers on {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} reports no online Tailscale peers.

      - alert: TailscaleExporterStale
        expr: time() - node_textfile_scrape_timestamp_seconds{file="tailscale-health.prom"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tailscale metrics are stale on {{ $labels.instance }}"
          description: >-
            The Tailscale health exporter has not refreshed metrics recently
            on {{ $labels.instance }}.
