name: Edge security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  public-endpoints:
    name: Validate public HAProxy endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssl

      - name: Validate endpoint availability and headers
        shell: bash
        run: |
          set -euo pipefail

          yq_available=false
          if command -v yq >/dev/null 2>&1; then
            yq_available=true
          fi

          python3 - <<'PY'
          import json
          import yaml

          with open("docs/public-endpoints.yaml") as f:
              data = yaml.safe_load(f)

          with open("/tmp/endpoints.json", "w") as f:
              json.dump(data["endpoints"], f)
          PY

          failures=0

          while IFS= read -r row; do
            name=$(jq -r '.name' <<<"$row")
            url=$(jq -r '.url' <<<"$row")
            expected_status=$(jq -r '.expected_status' <<<"$row")
            require_hsts=$(jq -r '.require_hsts' <<<"$row")
            min_tls=$(jq -r '.min_tls_version' <<<"$row")

            echo "==> Checking $name ($url)"

            headers=$(curl -sSIL --max-time 20 "$url")
            status=$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 20 "$url")

            if [[ "$status" != "$expected_status" ]]; then
              echo "::error::$name returned HTTP $status; expected $expected_status"
              failures=$((failures + 1))
            fi

            if [[ "$require_hsts" == "true" ]] && ! grep -qi '^strict-transport-security:' <<<"$headers"; then
              echo "::error::$name is missing Strict-Transport-Security"
              failures=$((failures + 1))
            fi

            protocol=$(curl -sSIL -o /dev/null -w '%{http_version}' --max-time 20 "$url")
            echo "$name: HTTP $status, protocol $protocol"
          done < <(jq -c '.[]' /tmp/endpoints.json)

          exit "$failures"

      - name: Check certificate expiry
        shell: bash
        run: |
          set -euo pipefail

          failures=0

          while IFS= read -r row; do
            name=$(jq -r '.name' <<<"$row")
            host=$(jq -r '.url' <<<"$row" | sed -E 's#^https://([^/:]+).*#\1#')

            echo "==> Checking certificate for $name ($host)"

            expiry=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)

            if [[ -z "$expiry" ]]; then
              echo "::error::$name certificate could not be validated"
              failures=$((failures + 1))
              continue
            fi

            expiry_epoch=$(date -d "$expiry" +%s)
            now_epoch=$(date +%s)
            days_left=$(( (expiry_epoch - now_epoch) / 86400 ))

            echo "$name certificate expires in $days_left days"

            if (( days_left < 14 )); then
              echo "::error::$name certificate expires in $days_left days"
              failures=$((failures + 1))
            fi
          done < <(jq -c '.[]' /tmp/endpoints.json)

          exit "$failures"
