name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Step 1: Install Nix
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Configure cachix (installs cachix CLI and configures caches)
      - uses: cachix/cachix-action@v15
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland,cuda-maintainers
          skipPush: true
          useDaemon: false

      - name: Flake check
        run: nix flake check --print-build-logs

  build-hosts:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [navi, oryx, r820, r730, r730xd]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Step 1: Install Nix
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Configure cachix
      - uses: cachix/cachix-action@v15
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nix-gaming,hyprland,cuda-maintainers
          useDaemon: false

      - name: Build host
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Push to aljam cache
        run: |
          result=$(nix build --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel)
          nix path-info --recursive $result | cachix push aljam

  summary:
    needs: [check, build-hosts]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All hosts built and cached"
