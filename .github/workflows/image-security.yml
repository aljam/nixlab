name: Image security

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trivy:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: livekit
            image: docker.io/livekit/livekit-server:latest
          - name: lk-jwt-service
            image: ghcr.io/element-hq/lk-jwt-service:latest
          - name: bgutil-pot-provider
            image: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Record scan result
        if: always()
        run: |
          echo "image=${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "status=enforced" >> "$GITHUB_STEP_SUMMARY"
